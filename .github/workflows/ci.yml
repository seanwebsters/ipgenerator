name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: webster
          POSTGRES_PASSWORD: webster
          POSTGRES_DB: webster_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webster" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://webster:webster@localhost:5432/webster_test
      TEST_DATABASE_URL: postgresql://webster:webster@localhost:5432/webster_test
      WEBSTER_SECRET_KEY: ${{ secrets.WEBSTER_SECRET_KEY || 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
